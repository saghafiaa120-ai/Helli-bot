target-version = "py312"
line-length = 110

[lint]
# E402 عمداً فعال است: در تست‌ها import بعد از importorskip انجام می‌شود.
select = ["E4", "E7", "E9", "F", "I", "RUF"]
# متن‌های فارسی/عربی کاراکترهای «مبهم» دارند و نباید خطا گرفته شوند.
# RUF005: الحاق tuple در فهرست دستورها خواناتر از unpack است.
ignore = ["RUF001", "RUF002", "RUF003", "RUF005"]

[lint.isort]
known-first-party = ["core", "database", "domain", "platforms", "services", "tests"]
